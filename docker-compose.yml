# Self-hosted, one command:   cp .env.example .env   &&   docker compose up -d
# Then open http://localhost:8000/admin and create your account.
services:
  app:
    build: .
    image: docs2chat:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - data:/data

  # Optional local LLM (no API costs):  docker compose --profile ollama up -d
  # then set LLM_PROVIDER=ollama and OLLAMA_BASE_URL=http://ollama:11434 in .env
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  data:
  ollama:
