<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI support chat for your website</title>
  <meta name="description" content="AI chat widget that answers customers from your FAQ, website and PDFs in Georgian, English and Russian, with Telegram handoff to a human. Open source.">
  <style>

    }
    :root[data-theme="dark"] { color-scheme: dark; --bg:#121211; --surface:#1a1a19; --surface-2:#222220; --border:#2f2f2c; --text:#fff; --text-2:#c3c2b7; --muted:#8f8e86; --accent:#5b8cff; --accent-ink:#0b0b0b; --accent-soft:#1d2a4a; }

    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Georgian","Noto Sans",Arial,sans-serif; }
    a { color: var(--accent); }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
    header { position: sticky; top: 0; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); z-index: 5; }
    header .wrap { display:flex; align-items:center; gap:18px; height:60px; }
    .logo { font-weight: 800; font-size: 18px; color: var(--text); text-decoration: none; margin-right: auto; }
    nav a { color: var(--text-2); text-decoration: none; font-size: 14px; }
    .btn { display:inline-flex; align-items:center; gap:6px; background:var(--accent); color:var(--accent-ink); padding:10px 18px; border-radius:10px; text-decoration:none; font-weight:700; border:1px solid transparent; font-size:15px; cursor:pointer; }
    .btn.secondary { background: var(--surface); color: var(--text); border-color: var(--border); }
    .lang { background:none; border:1px solid var(--border); color:var(--text-2); border-radius:8px; padding:4px 8px; cursor:pointer; font:inherit; font-size:13px; }
    .hero { padding: 72px 0 48px; display:grid; grid-template-columns: 1.1fr .9fr; gap: 40px; align-items:center; }
    .hero h1 { font-size: clamp(30px, 4.6vw, 48px); line-height: 1.15; margin: 0 0 16px; letter-spacing: -0.02em; }
    .hero p.lead { font-size: 18px; color: var(--text-2); margin: 0 0 24px; }
    .cta { display:flex; gap:10px; flex-wrap:wrap; }
    .note { font-size: 13px; color: var(--muted); margin-top: 12px; }
    .mock { background: var(--surface); border:1px solid var(--border); border-radius: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.10); overflow: hidden; }
    .mock .top { background: var(--accent); color: var(--accent-ink); padding: 14px 16px; font-weight: 700; }
    .mock .body { padding: 16px; display:flex; flex-direction:column; gap:10px; font-size: 14px; background: var(--surface-2); }
    .b { max-width: 85%; padding: 9px 12px; border-radius: 14px; }
    .b.u { align-self:flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
    .b.a { align-self:flex-start; background: var(--surface); border:1px solid var(--border); border-bottom-left-radius: 4px; }
    .b.s { align-self:center; font-size: 12px; color: var(--text-2); background: var(--accent-soft); }
    section { padding: 56px 0; }
    h2 { font-size: 30px; margin: 0 0 8px; letter-spacing: -0.01em; }
    .sub { color: var(--text-2); margin: 0 0 28px; }
    .features { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .feature { background: var(--surface); border:1px solid var(--border); border-radius: 14px; padding: 20px; }
    .feature .i { font-size: 24px; }
    .feature h3 { margin: 8px 0 6px; font-size: 17px; }
    .feature p { margin: 0; color: var(--text-2); font-size: 14px; }
    .steps { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; counter-reset: s; }
    .step { padding: 20px; border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 12px 12px 0; }
    .step b { display:block; margin-bottom: 4px; }
    .plans { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .plan { background: var(--surface); border:1px solid var(--border); border-radius: 16px; padding: 22px; display:flex; flex-direction:column; gap: 10px; }
    .plan.pop { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .plan .n { font-weight: 800; }
    .plan .p { font-size: 34px; font-weight: 800; line-height: 1; }
    .plan .p small { font-size: 14px; color: var(--muted); font-weight: 500; }
    .plan ul { margin: 0; padding-left: 18px; color: var(--text-2); font-size: 14px; flex: 1; }
    .trust { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
    .trust ul { margin: 10px 0 0; padding-left: 20px; color: var(--text-2); }
    details { background: var(--surface); border:1px solid var(--border); border-radius: 12px; padding: 14px 18px; margin-bottom: 10px; }
    summary { font-weight: 700; cursor: pointer; }
    details p { color: var(--text-2); margin: 10px 0 0; }
    footer { border-top: 1px solid var(--border); padding: 28px 0; color: var(--muted); font-size: 14px; }
    footer .wrap { display:flex; gap: 16px; flex-wrap: wrap; justify-content: space-between; }
    @media (max-width: 820px) { .hero { grid-template-columns: 1fr; padding-top: 40px; } nav .hide-m { display:none; } }
  </style>
</head>

          <div class="b s" data-t="mock_5"></div>

      </div>
    </div>

    <section>

      <p class="sub" data-t="f_sub"></p>
      <div class="features">
        <div class="feature"><div class="i">📚</div><h3 data-t="f1_t"></h3><p data-t="f1_p"></p></div>
        <div class="feature"><div class="i">🇬🇪</div><h3 data-t="f2_t"></h3><p data-t="f2_p"></p></div>

        <div class="feature"><div class="i">📇</div><h3 data-t="f4_t"></h3><p data-t="f4_p"></p></div>
        <div class="feature"><div class="i">📊</div><h3 data-t="f5_t"></h3><p data-t="f5_p"></p></div>
        <div class="feature"><div class="i">🧩</div><h3 data-t="f6_t"></h3><p data-t="f6_p"></p></div>
      </div>
    </section>

    <section>
      <h2 data-t="how_title"></h2>
      <div class="steps">
        <div class="step"><b data-t="s1_t"></b><span data-t="s1_p"></span></div>
        <div class="step"><b data-t="s2_t"></b><span data-t="s2_p"></span></div>
        <div class="step"><b data-t="s3_t"></b><span data-t="s3_p"></span></div>
      </div>
    </section>

    <section id="pricing">
      <h2 data-t="p_title"></h2>
      <p class="sub" data-t="p_sub"></p>
      <div class="plans" id="plans"></div>
      <p class="note" id="fee-note" hidden></p>
    </section>

    <section>
      <div class="trust">
        <h2 data-t="t_title"></h2>
        <ul>
          <li data-t="t_1"></li>
          <li data-t="t_2"></li>
          <li data-t="t_3"></li>
          <li data-t="t_4"></li>
        </ul>
      </div>
    </section>

    <section>
      <h2 data-t="faq_title"></h2>
      <details><summary data-t="q1"></summary><p data-t="a1"></p></details>
      <details><summary data-t="q2"></summary><p data-t="a2"></p></details>
      <details><summary data-t="q3"></summary><p data-t="a3"></p></details>
      <details><summary data-t="q4"></summary><p data-t="a4"></p></details>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <span>© <span id="year"></span> <span data-brand>Docs2Chat</span> · <span data-t="footer_os"></span></span>

    </div>
  </footer>

          q4: "How do I pay?", a4: "By card via Paddle (invoices and sales tax handled automatically), or by bank transfer against an invoice.",
          footer_os: "Open source, AGPL-3.0", terms: "Terms", privacy: "Privacy", refund: "Refunds",
        },
      };
      var lang = "ka";
      try { lang = localStorage.getItem("d2c_site_lang") || ((navigator.language || "").slice(0, 2) === "ka" ? "ka" : "en"); } catch (e) {}
      var info = { brand_name: "Docs2Chat", badge_url: "#" };
      var plans = null;

      function apply() {
        document.documentElement.lang = lang;
        document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = T[lang][el.getAttribute("data-t")] || ""; });
        document.getElementById("lang").textContent = lang === "ka" ? "English" : "ქართული";
        document.querySelectorAll("[data-brand]").forEach(function (el) { el.textContent = info.brand_name; });
        document.querySelectorAll("[data-github]").forEach(function (el) { el.href = info.badge_url; el.target = "_blank"; el.rel = "noopener"; });
        document.title = info.brand_name + " — " + T[lang].hero_title;
        renderPlans();
      }
      function renderPlans() {
        var box = document.getElementById("plans");
        if (!plans) return;
        box.textContent = "";
        plans.plans.forEach(function (p) {
          var card = document.createElement("div");
          card.className = "plan" + (p.id === "pro" ? " pop" : "");
          var n = document.createElement("div"); n.className = "n"; n.textContent = p.name;
          var price = document.createElement("div"); price.className = "p"; price.textContent = "$" + p.price_usd;
          var small = document.createElement("small"); small.textContent = T[lang].per_month; price.appendChild(small);
          var ul = document.createElement("ul");
          p.features.forEach(function (f) { var li = document.createElement("li"); li.textContent = f; ul.appendChild(li); });
          var a = document.createElement("a");
          a.className = "btn" + (p.id === "pro" ? "" : " secondary");
          a.href = "/admin#/signup";
          a.textContent = p.price_usd ? T[lang].choose : T[lang].free_btn;
          [n, price, ul, a].forEach(function (x) { card.appendChild(x); });
          box.appendChild(card);
        });
        var note = document.getElementById("fee-note");
        note.hidden = !(plans.platform_fee_percent > 0);
        note.textContent = T[lang].fee_note.replace("{p}", plans.platform_fee_percent);
      }
      document.getElementById("lang").addEventListener("click", function () {
        lang = lang === "ka" ? "en" : "ka";
        try { localStorage.setItem("d2c_site_lang", lang); } catch (e) {}
        apply();
      });
      document.getElementById("year").textContent = new Date().getFullYear();
      apply();
      fetch("/api/public/landing").then(function (r) { return r.json(); }).then(function (d) {
        info = d; apply();
        if (d.demo_widget_key) {
          var s = document.createElement("script");
          s.src = "/widget.js"; s.async = true; s.setAttribute("data-key", d.demo_widget_key);
          document.body.appendChild(s);
        }
      }).catch(function () {});
      fetch("/api/public/plans").then(function (r) { return r.json(); }).then(function (d) { plans = d; renderPlans(); }).catch(function () {});
    })();
  </script>
</body>
</html>
